<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>عافية</title>
  <meta name="description" content="أكلك وشربك ويومك، بأقل جهد.">
  <meta name="theme-color" content="">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="عافية">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the theme before first paint: saved choice, otherwise the phone's setting.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var root = document.documentElement;
      root.setAttribute('data-theme', t);
      var bg = getComputedStyle(root).getPropertyValue('--bg').trim();
      document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="no-tabs">
  <header class="app-header" id="header"></header>
  <main id="view" tabindex="-1"></main>
  <button class="fab" id="fab" type="button" hidden></button>
  <nav class="tabbar" id="tabbar" aria-label="التبويبات" hidden></nav>
  <div id="snackbar" role="status" aria-live="polite" hidden></div>
  <noscript><p style="padding:24px">التطبيق يحتاج JavaScript.</p></noscript>
</body>
</html>
